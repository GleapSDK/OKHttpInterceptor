// io.gleap:gleap-okhttp-interceptor 19.0.0 contains no classes: io.gleap.GleapOkHttpInterceptor is
// part of the Gleap Android SDK since 19.0.0. The Android SDK pins this artifact to 19.0.0, so an app
// that still declares an older version gets this empty release (plus the SDK it depends on) instead
// of a duplicate class build error.
//
// Publish: ./gradlew :okhttp-interceptor:publish -PNEXUS_USERNAME=... -PNEXUS_PASSWORD=...
// (signing.keyId / signing.password / signing.secretKeyRingFile in ~/.gradle/gradle.properties)

plugins {
    id 'maven-publish'
    id 'signing'
}

group = 'io.gleap'
version = '19.0.0'

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'gleap-okhttp-interceptor'
            pom {
                name = 'gleap-okhttp-interceptor'
                packaging = 'pom'
                description = 'Deprecated: GleapOkHttpInterceptor is part of the Gleap Android SDK since 19.0.0. This release only depends on the SDK.'
                url = 'https://github.com/GleapSDK/OKHttpInterceptor'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://github.com/GleapSDK/Android-SDK/blob/master/LICENSE.md'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'mondbaer'
                        name = 'Niklas Fessler'
                    }
                }
                scm {
                    url = 'https://github.com/GleapSDK/OKHttpInterceptor'
                    connection = 'scm:git@github.com:GleapSDK/OKHttpInterceptor.git'
                    developerConnection = 'scm:git@github.com:GleapSDK/OKHttpInterceptor.git'
                }
                withXml {
                    def dependency = asNode().appendNode('dependencies').appendNode('dependency')
                    dependency.appendNode('groupId', 'io.gleap')
                    dependency.appendNode('artifactId', 'gleap-android-sdk')
                    dependency.appendNode('version', '19.0.0')
                    dependency.appendNode('type', 'aar')
                    dependency.appendNode('scope', 'compile')
                }
            }
        }
    }

    repositories {
        maven {
            url = uri(findProperty('RELEASE_REPOSITORY_URL') ?: 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
            credentials {
                username = findProperty('NEXUS_USERNAME') ?: ''
                password = findProperty('NEXUS_PASSWORD') ?: ''
            }
        }
    }
}

signing {
    required { gradle.taskGraph.allTasks.any { it.name.startsWith('publish') && !it.name.contains('MavenLocal') } }
    sign publishing.publications.mavenJava
}
